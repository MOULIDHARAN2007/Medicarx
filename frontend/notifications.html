<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification Center — MediCareX</title>
    <meta name="description" content="Track medicine in-stock alerts, prescription readiness, and doctor updates in the MediCareX notification center.">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/pages/patient.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="app-sidebar"></aside>

        <div class="main-wrapper">
            <header class="topbar" id="app-topbar"></header>

            <main class="page-container">
                <div class="page-header">
                    <div>
                        <h1 class="page-title">Notification Center</h1>
                        <p class="page-subtitle">Real-time alerts for medicine stock, prescription refills, and physician updates</p>
                    </div>

                    <button class="btn btn-secondary btn-sm" id="btn-mark-all-read" onclick="markAllRead()">
                        Mark All as Read
                    </button>
                </div>

                <!-- Tabs: All, Medicine, Pharmacy, Prescription, System -->
                <div class="tabs-header">
                    <button class="tab-btn active" onclick="filterNotifs(this, 'All')">All</button>
                    <button class="tab-btn" onclick="filterNotifs(this, 'Medicine')">Medicine Alerts</button>
                    <button class="tab-btn" onclick="filterNotifs(this, 'Prescription')">Prescriptions</button>
                    <button class="tab-btn" onclick="filterNotifs(this, 'Pharmacy')">Pharmacy Refills</button>
                    <button class="tab-btn" onclick="filterNotifs(this, 'System')">System Updates</button>
                </div>

                <!-- 2-Column Split: Notification List Feed (Left/Center) + Selected Detail Panel (Right) -->
                <div class="dashboard-grid-2" style="grid-template-columns: 1.2fr 0.8fr;">
                    <!-- Notification List -->
                    <div class="card" id="notif-feed-container" style="padding: 0.5rem; overflow: hidden;">
                        <div style="padding: 2rem; text-align: center; color: var(--text-muted);">Loading notifications...</div>
                    </div>

                    <!-- Selected Notification Detail Panel -->
                    <div class="card" id="notif-detail-panel" style="padding: 1.75rem; height: fit-content; position: sticky; top: 90px;">
                        <div style="text-align: center; padding: 2rem 0; color: var(--text-muted);">
                            <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🔔</div>
                            <h4 style="color: var(--navy); margin-bottom: 0.25rem;">Select a Notification</h4>
                            <p style="font-size: 13px;">Click on any alert from the list to view comprehensive details and take instant actions.</p>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/components/toast.js"></script>
    <script src="/js/components/shell.js"></script>
    <script>
        let currentFilter = 'All';
        let notifsList = [];

        document.addEventListener('DOMContentLoaded', () => {
            window.Shell.init('notifications');
            loadNotifications();
        });

        async function filterNotifs(btn, type) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = type;
            loadNotifications();
        }

        async function loadNotifications() {
            const feed = document.getElementById('notif-feed-container');
            try {
                const res = await window.api.getNotifications({ type: currentFilter });
                notifsList = res.data || [];

                if (notifsList.length === 0) {
                    feed.innerHTML = `
                        <div style="padding: 3rem; text-align: center;">
                            <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">✓</div>
                            <h4 style="color: var(--navy);">You're all caught up!</h4>
                            <p style="font-size: 13px; color: var(--text-secondary);">No new notifications under this category.</p>
                        </div>
                    `;
                    return;
                }

                feed.innerHTML = notifsList.map((n, idx) => `
                    <div class="medicine-card-row" id="notif-row-${n.id}" onclick="selectNotification(${idx})" style="cursor: pointer; padding: 1rem 1.25rem; background: ${n.isRead ? '#ffffff' : '#f8fafc'};">
                        <div class="flex items-start gap-3" style="flex: 1;">
                            <div style="width: 36px; height: 36px; border-radius: 50%; background: ${getNotifColor(n.type)}; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0;">
                                ${getNotifIcon(n.type)}
                            </div>
                            <div class="flex flex-col gap-1">
                                <div style="display: flex; align-items: center; gap: 0.5rem;">
                                    <span style="font-size: 13px; font-weight: 700; color: var(--navy);">${n.title}</span>
                                    ${!n.isRead ? '<span class="badge badge-blue" style="font-size: 9px; padding: 2px 6px;">NEW</span>' : ''}
                                </div>
                                <span style="font-size: 12px; color: var(--text-secondary); line-height: 1.4;">${n.message.substring(0, 85)}...</span>
                                <span style="font-size: 11px; color: var(--text-muted);">${n.timeGroup} • ${n.type}</span>
                            </div>
                        </div>
                    </div>
                `).join('');

                // Auto select first notification
                if (notifsList.length > 0) {
                    selectNotification(0);
                }

            } catch (err) {
                feed.innerHTML = `<div style="padding: 2rem; color: var(--danger); text-align: center;">Error: ${err.message}</div>`;
            }
        }

        function getNotifColor(type) {
            if (type === 'Medicine') return '#10b981';
            if (type === 'Prescription') return '#2563eb';
            if (type === 'Pharmacy') return '#8b5cf6';
            return '#64748b';
        }

        function getNotifIcon(type) {
            if (type === 'Medicine') return '💊';
            if (type === 'Prescription') return '📋';
            if (type === 'Pharmacy') return '🏥';
            return '🔔';
        }

        async function selectNotification(index) {
            const n = notifsList[index];
            if (!n) return;

            document.querySelectorAll('.medicine-card-row').forEach(el => el.style.borderLeft = 'none');
            const row = document.getElementById(`notif-row-${n.id}`);
            if (row) {
                row.style.borderLeft = '4px solid var(--primary-blue)';
            }

            // Mark read on server
            if (!n.isRead) {
                window.api.markNotifAsRead(n.id);
                n.isRead = true;
            }

            const panel = document.getElementById('notif-detail-panel');
            panel.innerHTML = `
                <div class="flex items-center justify-between" style="margin-bottom: 1.25rem;">
                    <span class="badge badge-blue">${n.type} Alert</span>
                    <span style="font-size: 12px; color: var(--text-muted);">${n.timeGroup}</span>
                </div>

                <h3 style="font-size: 1.25rem; color: var(--navy); font-weight: 700; margin-bottom: 0.75rem;">${n.title}</h3>
                <p style="font-size: 14px; line-height: 1.7; color: var(--text-secondary); margin-bottom: 1.5rem;">
                    ${n.message}
                </p>

                <div style="background: #f8fafc; border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; margin-bottom: 1.5rem;">
                    <div style="font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.5rem;">Recommended Quick Actions</div>
                    <div class="flex flex-col gap-2">
                        <button class="btn btn-primary btn-sm w-full" onclick="window.location.href='/map.html'">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                            Find Store on Map
                        </button>
                        <button class="btn btn-secondary btn-sm w-full" onclick="window.location.href='/search.html'">
                            Check Medicine Details
                        </button>
                    </div>
                </div>

                <div style="font-size: 11px; color: var(--text-muted); text-align: center;">
                    Reference ID: #${n.id} • Verified by MediCareX Live Inventory Engine
                </div>
            `;
        }

        async function markAllRead() {
            try {
                await window.api.markAllNotifsAsRead();
                window.toast.success('All notifications marked as read.');
                loadNotifications();
            } catch (err) {
                window.toast.error(err.message);
            }
        }
    </script>
</body>
</html>
