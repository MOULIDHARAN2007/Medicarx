<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicines Management — MediCareX Admin</title>
    <meta name="description" content="Manage system-wide pharmaceutical catalog, active generic formulations, and pricing.">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/pages/patient.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="app-sidebar"></aside>

        <div class="main-wrapper">
            <header class="topbar" id="app-topbar"></header>

            <main class="page-container">
                <div class="page-header">
                    <div>
                        <h1 class="page-title">Medicines Catalog Management</h1>
                        <p class="page-subtitle">Central formulary database of verified active salts, brand drugs, and dosage forms</p>
                    </div>

                    <button class="btn btn-primary" onclick="openAddMedicineModal()">
                        + Add New Medicine
                    </button>
                </div>

                <!-- Filters & Search Toolbar -->
                <div class="card" style="padding: 1.25rem; margin-bottom: 1.5rem;">
                    <div class="flex justify-between items-center" style="flex-wrap: wrap; gap: 1rem;">
                        <div class="topbar-search" style="width: 340px;">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                            <input type="text" id="admin-med-search" placeholder="Search catalog by name, generic, or brand..." oninput="loadAdminMedicines()" />
                        </div>

                        <select id="admin-med-cat" class="form-select" style="width: auto;" onchange="loadAdminMedicines()">
                            <option value="All">All Categories</option>
                            <option value="Antibiotics">Antibiotics</option>
                            <option value="Pain Relief">Pain Relief</option>
                            <option value="Diabetes">Diabetes</option>
                            <option value="Cardiology">Cardiology</option>
                            <option value="Allergy">Allergy</option>
                            <option value="Gastroenterology">Gastroenterology</option>
                            <option value="Respiratory">Respiratory</option>
                            <option value="Vitamins & Supplements">Vitamins & Supplements</option>
                        </select>
                    </div>
                </div>

                <!-- Medicines Data Table -->
                <div class="card">
                    <div class="table-responsive" style="border: none;">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th style="width: 30px;"><input type="checkbox" style="accent-color: var(--primary-blue);" /></th>
                                    <th>Medicine Name</th>
                                    <th>Generic Name</th>
                                    <th>Category</th>
                                    <th>Form & Dosage</th>
                                    <th>Base Price</th>
                                    <th>Prescription (Rx)</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="admin-meds-tbody">
                                <tr>
                                    <td colspan="8" style="text-align: center; padding: 2rem; color: var(--text-muted);">Loading catalog...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Add/Edit Medicine Modal -->
    <div class="modal-overlay" id="admin-med-modal">
        <div class="modal-container" style="max-width: 650px;">
            <div class="modal-header">
                <h3 style="color: var(--navy);" id="admin-med-modal-title">Add New Medicine to Catalog</h3>
                <button class="btn-icon" onclick="closeAdminMedModal()">✕</button>
            </div>
            <form id="admin-med-form">
                <input type="hidden" id="admin-med-id" />
                <div class="modal-body">
                    <div class="flex gap-4">
                        <div class="form-group w-full">
                            <label class="form-label" for="med-name-in">Medicine Name</label>
                            <input type="text" id="med-name-in" class="form-input" placeholder="e.g. Amoxicillin 500mg" required />
                        </div>
                        <div class="form-group w-full">
                            <label class="form-label" for="med-generic-in">Generic Salt / Molecule</label>
                            <input type="text" id="med-generic-in" class="form-input" placeholder="e.g. Amoxicillin Trihydrate" required />
                        </div>
                    </div>

                    <div class="flex gap-4">
                        <div class="form-group w-full">
                            <label class="form-label" for="med-brand-in">Brand Equivalents</label>
                            <input type="text" id="med-brand-in" class="form-input" placeholder="e.g. Moxclav / Amoxil" required />
                        </div>
                        <div class="form-group w-full">
                            <label class="form-label" for="med-cat-in">Therapeutic Category</label>
                            <select id="med-cat-in" class="form-select">
                                <option value="Antibiotics">Antibiotics</option>
                                <option value="Pain Relief">Pain Relief</option>
                                <option value="Diabetes">Diabetes</option>
                                <option value="Cardiology">Cardiology</option>
                                <option value="Allergy">Allergy</option>
                                <option value="Gastroenterology">Gastroenterology</option>
                                <option value="Respiratory">Respiratory</option>
                                <option value="Vitamins & Supplements">Vitamins & Supplements</option>
                            </select>
                        </div>
                    </div>

                    <div class="flex gap-4">
                        <div class="form-group w-full">
                            <label class="form-label" for="med-dosage-in">Dosage Strength</label>
                            <input type="text" id="med-dosage-in" class="form-input" placeholder="e.g. 500mg" required />
                        </div>
                        <div class="form-group w-full">
                            <label class="form-label" for="med-form-in">Dosage Form</label>
                            <select id="med-form-in" class="form-select">
                                <option value="Tablet">Tablet</option>
                                <option value="Capsule">Capsule</option>
                                <option value="Syrup">Syrup</option>
                                <option value="Injection">Injection</option>
                                <option value="Ointment">Ointment</option>
                                <option value="Drops">Drops</option>
                            </select>
                        </div>
                        <div class="form-group w-full">
                            <label class="form-label" for="med-price-in">Base Retail Price (₹)</label>
                            <input type="number" id="med-price-in" class="form-input" step="0.5" min="1" value="85.50" required />
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="flex items-center gap-2" style="font-size: 13px; color: var(--navy); cursor: pointer;">
                            <input type="checkbox" id="med-rx-in" style="accent-color: var(--primary-blue);" />
                            Prescription (Rx) Required for Dispensing
                        </label>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="med-desc-in">Therapeutic Description & Uses</label>
                        <textarea id="med-desc-in" class="form-textarea" rows="2" placeholder="Clinical indications, mechanisms, and usage guidelines..."></textarea>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeAdminMedModal()">Cancel</button>
                    <button type="submit" id="btn-save-admin-med" class="btn btn-primary">Save to Catalog</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/components/toast.js"></script>
    <script src="/js/components/shell.js"></script>
    <script>
        let adminMedsList = [];

        document.addEventListener('DOMContentLoaded', () => {
            window.Shell.init('admin-medicines');
            loadAdminMedicines();
        });

        async function loadAdminMedicines() {
            const tbody = document.getElementById('admin-meds-tbody');
            const search = document.getElementById('admin-med-search').value.trim();
            const cat = document.getElementById('admin-med-cat').value;

            try {
                const res = await window.api.getMedicines({ q: search, category: cat, limit: 100 });
                adminMedsList = res.data || [];

                if (adminMedsList.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="8" style="padding: 3rem; text-align: center; color: var(--text-muted);">No catalog items found.</td></tr>`;
                    return;
                }

                tbody.innerHTML = adminMedsList.map(m => `
                    <tr>
                        <td><input type="checkbox" style="accent-color: var(--primary-blue);" /></td>
                        <td>
                            <strong style="color: var(--navy); font-size: 14px;">${m.name}</strong>
                            <div style="font-size: 11px; color: var(--text-secondary);">Brand: ${m.brand}</div>
                        </td>
                        <td style="font-size: 13px; color: var(--navy);">${m.genericName}</td>
                        <td><span class="badge badge-gray">${m.category}</span></td>
                        <td><span class="badge badge-blue">${m.form} (${m.dosage})</span></td>
                        <td style="font-weight: 700; color: var(--navy);">₹${m.basePrice.toFixed(2)}</td>
                        <td>
                            ${m.prescriptionRequired ? '<span class="badge badge-purple">Rx Required</span>' : '<span class="badge badge-gray">OTC</span>'}
                        </td>
                        <td>
                            <div class="flex gap-2">
                                <button class="btn btn-sm btn-secondary" onclick="openEditMedicineModal(${m.id})">Edit</button>
                                <button class="btn btn-sm btn-icon" onclick="deleteMedicine(${m.id})" title="Delete">🗑</button>
                            </div>
                        </td>
                    </tr>
                `).join('');

            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="8" style="padding: 2rem; color: var(--danger); text-align: center;">Error: ${err.message}</td></tr>`;
            }
        }

        function openAddMedicineModal() {
            document.getElementById('admin-med-id').value = '';
            document.getElementById('admin-med-modal-title').innerText = 'Add New Medicine to Catalog';
            document.getElementById('med-name-in').value = '';
            document.getElementById('med-generic-in').value = '';
            document.getElementById('med-brand-in').value = '';
            document.getElementById('med-dosage-in').value = '500mg';
            document.getElementById('med-price-in').value = '50.00';
            document.getElementById('med-desc-in').value = '';
            document.getElementById('admin-med-modal').classList.add('open');
        }

        function openEditMedicineModal(id) {
            const m = adminMedsList.find(item => item.id === id);
            if (!m) return;

            document.getElementById('admin-med-id').value = m.id;
            document.getElementById('admin-med-modal-title').innerText = `Edit ${m.name}`;
            document.getElementById('med-name-in').value = m.name;
            document.getElementById('med-generic-in').value = m.genericName;
            document.getElementById('med-brand-in').value = m.brand;
            document.getElementById('med-cat-in').value = m.category;
            document.getElementById('med-dosage-in').value = m.dosage;
            document.getElementById('med-form-in').value = m.form;
            document.getElementById('med-price-in').value = m.basePrice;
            document.getElementById('med-rx-in').checked = m.prescriptionRequired;
            document.getElementById('med-desc-in').value = m.description || '';
            document.getElementById('admin-med-modal').classList.add('open');
        }

        function closeAdminMedModal() {
            document.getElementById('admin-med-modal').classList.remove('open');
        }

        document.getElementById('admin-med-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const id = document.getElementById('admin-med-id').value;
            const name = document.getElementById('med-name-in').value.trim();
            const genericName = document.getElementById('med-generic-in').value.trim();
            const brand = document.getElementById('med-brand-in').value.trim();
            const category = document.getElementById('med-cat-in').value;
            const dosage = document.getElementById('med-dosage-in').value.trim();
            const form = document.getElementById('med-form-in').value;
            const basePrice = parseFloat(document.getElementById('med-price-in').value);
            const prescriptionRequired = document.getElementById('med-rx-in').checked;
            const description = document.getElementById('med-desc-in').value.trim();

            const payload = { name, genericName, brand, category, dosage, form, basePrice, prescriptionRequired, description };

            try {
                if (id) {
                    await window.api.updateAdminMedicine({ id: parseInt(id), ...payload });
                    window.toast.success('Medicine catalog updated!');
                } else {
                    await window.api.createAdminMedicine(payload);
                    window.toast.success('New medicine added to platform catalog!');
                }
                closeAdminMedModal();
                loadAdminMedicines();
            } catch (err) {
                window.toast.error(err.message);
            }
        });

        async function deleteMedicine(id) {
            if (!confirm('Are you sure you want to delete this medicine from the global catalog?')) return;
            try {
                await window.api.deleteAdminMedicine(id);
                window.toast.success('Medicine deleted from catalog.');
                loadAdminMedicines();
            } catch (err) {
                window.toast.error(err.message);
            }
        }
    </script>
</body>
</html>
